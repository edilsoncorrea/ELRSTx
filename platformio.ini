; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
; Board options and pinouts: docs/HARDWARE.md

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + BLE + web OTA need a bigger app slot; keeps two OTA slots
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
monitor_filters =
    esp32_exception_decoder
    colorize

; Default: ESP32 DevKit (ESP32-WROOM-32), buttons/switches on GPIOs
[env:esp32dev]
board = esp32dev
; errors only: info-level log strings cost flash that Bluedroid BLE already uses up
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Alternative: ESP32-C3, buttons/switches through a PCF8574 I2C expander
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0

; Upload over WiFi: enable the AP first ('wifi on'), join it, then: pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=elrstx1234
