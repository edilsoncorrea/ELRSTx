; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
; Board options and pinouts: docs/HARDWARE.md

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
upload_speed = 921600
; WiFi + web OTA need a bigger app slot; keeps two OTA slots
board_build.partitions = min_spiffs.csv
lib_deps =
    adafruit/Adafruit SSD1306@^2.5.7
    adafruit/Adafruit GFX Library@^1.11.9
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    bblanchon/ArduinoJson@^7.2.1
; Typed text is shown and sent on Enter
monitor_echo = yes
monitor_filters =
    esp32_exception_decoder
    send_on_enter

; Pins, display and CRSF wiring are not compiled in: they come from hardware/<board>.json
; (built in as the default) or from a saved override ('hw set ...', web /hardware).

; Default: ESP32 DevKit (ESP32-WROOM-32), buttons/switches on GPIOs
[env:esp32dev]
board = esp32dev
board_build.embed_txtfiles = hardware/esp32dev.json
build_flags =
    -D CORE_DEBUG_LEVEL=1

; Alternative: ESP32-C3, buttons/switches through a PCF8574 I2C expander
[env:esp32-c3-devkitm-1]
board = esp32-c3-devkitm-1
board_build.embed_txtfiles = hardware/esp32c3.json
build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
monitor_dtr = 0
monitor_rts = 0

; Upload over WiFi: 'wifi on' first. On the home network: pio run -e ota -t upload
; On the radio's own AP (join ELRSTx-XXXX): pio run -e ota -t upload --upload-port 192.168.4.1
[env:ota]
extends = env:esp32dev
; Sent to the radio's web page (/update) by HTTP: unlike espota, the radio
; never has to connect back to the PC, so the Windows firewall does not block it.
; Turn WiFi on first (Menu > WiFi / OTA). On the radio's own AP: upload_port = 192.168.4.1
upload_protocol = custom
upload_port = elrstx.local
upload_command = curl -sS --fail-with-body -m 180 -F "fw=@$SOURCE" http://$UPLOAD_PORT/update
